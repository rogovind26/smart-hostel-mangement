<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Complaints - Smart Hostel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="dashboard-header">

        <h1>📢 My Complaints</h1>

        <div class="student-info">
            <span>👨‍🎓 Student</span>
            <a href="student-dashboard.html">Dashboard</a>
        </div>

    </header>


    <!-- Main Content -->
    <main class="dashboard-container">

        <!-- Welcome Section -->
        <section class="welcome-section">

            <h2>Submit a Complaint 📝</h2>

            <p>
                Report any hostel problem to the warden.
            </p>

        </section>


        <!-- Complaint Form -->
        <section class="complaint-form-card">

            <h2>📝 Complaint Form</h2>

            <form id="complaintForm">

                <div class="form-group">

                    <label for="complaintSubject">
                        Complaint Subject
                    </label>

                    <input
                        type="text"
                        id="complaintSubject"
                        placeholder="Example: Fan not working"
                        required
                    >

                </div>


                <div class="form-group full-width">

                    <label for="complaintDescription">
                        Complaint Description
                    </label>

                    <textarea
                        id="complaintDescription"
                        rows="5"
                        placeholder="Describe your problem..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="complaint-submit-btn"
                >
                    📤 Submit Complaint
                </button>

            </form>

            <p id="complaintMessage"></p>

        </section>


        <!-- Complaint History -->
        <section class="complaint-history-card">

            <h2>📋 My Complaint History</h2>

            <div class="table-container">

                <table id="myComplaintTable">

                    <thead>

                        <tr>
                            <th>Subject</th>
                            <th>Description</th>
                            <th>Status</th>
                        </tr>

                    </thead>


                    <tbody id="myComplaintTableBody">

                        

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Smart Hostel Management System
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
