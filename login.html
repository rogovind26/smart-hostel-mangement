<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Hostel Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏠 Smart Hostel Management</h1>
        <p>Login to your account</p>
    </header>


    <main class="login-container">

        <div class="login-box">

            <h2>Welcome Back 👋</h2>

            <p class="login-subtitle">
                Login to access your hostel dashboard
            </p>


            <form id="loginForm">

                <label for="userType">Login As</label>

                <select id="userType">
                    <option value="student">Student</option>
                    <option value="warden">Warden / Admin</option>
                </select>


                <label for="email">Email / Student ID</label>

                <input
                    type="text"
                    id="email"
                    placeholder="Enter your email or student ID"
                    required
                >


                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="loginMessage"></p>


            <p class="register-text">
                Don't have an account?
                <a href="#">Register Now</a>
            </p>

        </div>

    </main>


    <footer>
        <p>© 2026 Smart Hostel Management System</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
