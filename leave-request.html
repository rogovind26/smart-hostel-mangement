<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave Request - Smart Hostel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="dashboard-header">

        <h1>📋 Leave Request</h1>

        <div class="student-info">
            <span>👨‍🎓 Student</span>
            <a href="student-dashboard.html">Dashboard</a>
        </div>

    </header>


    <!-- Main Content -->
    <main class="dashboard-container">

        <!-- Welcome Section -->
        <section class="welcome-section">

            <h2>Apply for Leave 📝</h2>

            <p>
                Submit your leave request to the hostel warden.
            </p>

        </section>


        <!-- Leave Form -->
        <section class="leave-form-card">

            <h2>📝 Leave Application</h2>

            <form id="leaveRequestForm">

                <div class="form-group">

                    <label for="fromDate">
                        From Date
                    </label>

                    <input
                        type="date"
                        id="fromDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="toDate">
                        To Date
                    </label>

                    <input
                        type="date"
                        id="toDate"
                        required
                    >

                </div>


                <div class="form-group full-width">

                    <label for="leaveReason">
                        Reason for Leave
                    </label>

                    <textarea
                        id="leaveReason"
                        rows="4"
                        placeholder="Enter reason for leave..."
                        required
                    ></textarea>

                </div>


                <button type="submit" class="leave-submit-btn">
                    📤 Submit Leave Request
                </button>

            </form>

            <p id="leaveMessage"></p>

        </section>


        <!-- Leave Status -->
        <section class="leave-status-card">

            <h2>📋 My Leave Requests</h2>

            <div class="table-container">

                <table id="myLeaveTable">

                    <thead>

                        <tr>
                            <th>From</th>
                            <th>To</th>
                            <th>Reason</th>
                            <th>Status</th>
                        </tr>

                    </thead>


                    <tbody id="myLeaveTableBody">

                        

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Smart Hostel Management System
        </p>

    </footer>


    <script>
    const leaveRequestForm =
        document.getElementById("leaveRequestForm");

    if (leaveRequestForm) {

        leaveRequestForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const fromDate =
                document.getElementById("fromDate").value;

            const toDate =
                document.getElementById("toDate").value;

            const reason =
                document.getElementById("leaveReason").value.trim();

            const message =
                document.getElementById("leaveMessage");

            // Check fields
            if (
                fromDate === "" ||
                toDate === "" ||
                reason === ""
            ) {
                message.textContent =
                    "Please fill all leave details.";

                message.style.color = "red";

                return;
            }

            // Check date
            if (toDate < fromDate) {

                message.textContent =
                    "To Date cannot be before From Date.";

                message.style.color = "red";

                return;
            }

            // Student information
            const studentId =
                localStorage.getItem("currentStudentId") ||
                "STU001";

            const studentName =
                localStorage.getItem("currentStudentName") ||
                "Rahul Kumar";

            // Get old leaves
            let leaves =
                JSON.parse(
                    localStorage.getItem("leaves")
                ) || [];

            // Create leave
            const leave = {
                studentId: studentId,
                studentName: studentName,
                fromDate: fromDate,
                toDate: toDate,
                reason: reason,
                status: "🟡 Pending"
            };

            // Save
            leaves.push(leave);

            localStorage.setItem(
                "leaves",
                JSON.stringify(leaves)
            );

            // Show in table
            const tableBody =
                document.getElementById("myLeaveTableBody");

            if (tableBody) {

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td>${fromDate}</td>
                    <td>${toDate}</td>
                    <td>${reason}</td>
                    <td class="my-leave-status">
                        🟡 Pending
                    </td>
                `;

                tableBody.appendChild(row);
            }

            // Clear form
            leaveRequestForm.reset();

            message.textContent =
                "Leave request submitted successfully!";

            message.style.color = "green";
        });
    }


    // Load saved leaves
    function loadStudentLeaves() {

        const leaves =
            JSON.parse(
                localStorage.getItem("leaves")
            ) || [];

        const tableBody =
            document.getElementById("myLeaveTableBody");

        if (!tableBody) {
            return;
        }

        tableBody.innerHTML = "";

        leaves.forEach(function(leave) {

            const row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${leave.fromDate || "-"}</td>
                <td>${leave.toDate || "-"}</td>
                <td>${leave.reason || "-"}</td>
                <td class="my-leave-status">
                    ${leave.status || "🟡 Pending"}
                </td>
            `;

            tableBody.appendChild(row);
        });
    }

    loadStudentLeaves();
</script>
</body>

</html>
