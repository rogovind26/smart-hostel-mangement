<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complaint Management - Smart Hostel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="dashboard-header">

        <h1>📢 Complaint Management</h1>

        <div class="student-info">
            <span>👤 Warden</span>
            <a href="warden-dashboard.html">Dashboard</a>
        </div>

    </header>


    <!-- Main Content -->
    <main class="dashboard-container">

        <!-- Welcome Section -->
        <section class="welcome-section">

            <h2>Manage Complaints</h2>

            <p>
                View, search and manage student complaints.
            </p>

        </section>


        <!-- Search Section -->
        <section class="search-section">

            <input
                type="text"
                id="complaintSearch"
                placeholder="🔍 Search complaint..."
                onkeyup="searchComplaint()"
            >

        </section>


        <!-- Complaint Table -->
        <section class="student-table-section">

            <h2>📋 Student Complaints</h2>

            <div class="table-container">

                <table id="complaintTable">

                    <thead>

                        <tr>
                            <th>Complaint ID</th>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Complaint</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>

                    </thead>


                    <tbody id="complaintTableBody">

                        
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Smart Hostel Management System
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
