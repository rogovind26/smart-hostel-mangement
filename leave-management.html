<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave Management - Smart Hostel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="dashboard-header">

        <h1>📋 Leave Management</h1>

        <div class="student-info">
            <span>👤 Warden</span>
            <a href="warden-dashboard.html">Dashboard</a>
        </div>

    </header>


    <!-- Main Content -->
    <main class="dashboard-container">

        <!-- Welcome Section -->
        <section class="welcome-section">

            <h2>Manage Leave Requests</h2>

            <p>
                Review and manage student leave requests.
            </p>

        </section>


        <!-- Search -->
        <section class="search-section">

            <input
                type="text"
                id="leaveSearch"
                placeholder="🔍 Search by student name or ID..."
                onkeyup="searchLeave()"
            >

        </section>


        <!-- Leave Requests -->
        <section class="student-table-section">

            <h2>Leave Requests</h2>

            <div class="table-container">

                <table id="leaveTable">

                    <thead>

                        <tr>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Leave Date</th>
                            <th>Return Date</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="leaveTableBody">

                        
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Smart Hostel Management System
        </p>

    </footer>


<script>

function loadWardenLeaves() {

    const leaves =
        JSON.parse(localStorage.getItem("leaves")) || [];

    const tableBody =
        document.getElementById("leaveTableBody");

    if (!tableBody) {
        return;
    }

    tableBody.innerHTML = "";

    leaves.forEach(function(leave, index) {

        const row =
            document.createElement("tr");

        row.innerHTML = `
            <td>${leave.studentId || "-"}</td>

            <td>${leave.studentName || "-"}</td>

            <td>${leave.fromDate || "-"}</td>

            <td>${leave.toDate || "-"}</td>

            <td>${leave.reason || "-"}</td>

            <td class="leave-status">
                ${leave.status || "🟡 Pending"}
            </td>

            <td>

                <button
                    class="approve-btn"
                    onclick="approveLeave(${index})">
                    ✅ Approve
                </button>

                <button
                    class="reject-btn"
                    onclick="rejectLeave(${index})">
                    ❌ Reject
                </button>

            </td>
        `;

        tableBody.appendChild(row);
    });
}


// ==============================
// Approve Leave
// ==============================

function approveLeave(index) {

    let leaves =
        JSON.parse(localStorage.getItem("leaves")) || [];

    if (!leaves[index]) {
        return;
    }

    leaves[index].status =
        "🟢 Approved";

    localStorage.setItem(
        "leaves",
        JSON.stringify(leaves)
    );

    loadWardenLeaves();
}


// ==============================
// Reject Leave
// ==============================

function rejectLeave(index) {

    let leaves =
        JSON.parse(localStorage.getItem("leaves")) || [];

    if (!leaves[index]) {
        return;
    }

    leaves[index].status =
        "🔴 Rejected";

    localStorage.setItem(
        "leaves",
        JSON.stringify(leaves)
    );

    loadWardenLeaves();
}


// Load leaves when page opens
loadWardenLeaves();

</script>

</body>

</html>
